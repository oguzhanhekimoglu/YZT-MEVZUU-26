[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "operational-decision"
version = "0.1.0"
description = "Local operational decision support contracts"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.12,<2",
  "qdrant-client>=1.19,<2",
  "sentence-transformers>=3,<6",
  "transformers>=4.51,<6",
  "torch>=2.5,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "orjson>=3.10,<4",
  "structlog>=24,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
demo-ui = [
    "streamlit>=1.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/operational_decision"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", "phase3_test_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.coverage.run]
source = ["operational_decision"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false
